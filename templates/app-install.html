<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Install @APP_NAME@</title>
    <meta
      name="description"
      content="Install @APP_NAME@ on Linux with Flatpak. @APP_SUMMARY@"
    >
    <meta name="theme-color" content="#0b0d12">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Install @APP_NAME@">
    <meta property="og:description" content="@APP_SUMMARY@">
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b82f6'/%3E%3Cpath d='M32 14 48 23v18L32 50 16 41V23z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M16 23l16 9 16-9M32 32v18' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="/styles.css?v=@STYLES_VERSION@">
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z M3.5 7 12 11.5 20.5 7 M12 11.5v10"/></svg>
          </span>
          <span>astrovm</span>
        </a>
        <a class="nav-link" href="/">All apps</a>
      </header>

      <section class="app-hero">
        @APP_ICON@
        <div class="app-hero-text">
          <h1>@APP_NAME@</h1>
          <p class="lede">@APP_SUMMARY@</p>
          <div class="arch-list" aria-label="Supported architectures">
          @APP_ARCH_BADGES@
          </div>
        </div>
      </section>

      <div class="actions">
        <a
          id="install-link"
          class="button button-primary"
          href="flatpak+https://flatpak.4st.li/@APP_ID@.flatpakref"
        >
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11 M7 10.5l5 5 5-5 M5 20h14"/></svg>
          <span>Install</span>
        </a>
        <a class="button" href="@REPOSITORY_URL@">
          <svg
            class="github-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/>
          </svg>
          <span>Source code</span>
        </a>
      </div>
      <p class="fallback">
        Nothing opened?
        <a href="/@APP_ID@.flatpakref">Download the installer</a>
        or use the terminal.
      </p>

      @APP_SCREENSHOT@

      <details class="terminal">
        <summary>Install from a terminal</summary>
        <div class="command-row">
          <pre><code>flatpak install https://flatpak.4st.li/@APP_ID@.flatpakref</code></pre>
          <button
            class="copy-button"
            type="button"
            data-copy="flatpak install https://flatpak.4st.li/@APP_ID@.flatpakref"
          >
            Copy
          </button>
        </div>
      </details>
    </main>
    <script>
      try {
        window.location.replace(document.getElementById("install-link").href);
      } catch {
        // This browser cannot open the software manager; the page stays put.
      }

      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(button.dataset.copy);
          } catch {
            const field = document.createElement("textarea");
            field.value = button.dataset.copy;
            document.body.append(field);
            field.select();
            document.execCommand("copy");
            field.remove();
          }
          button.textContent = "Copied";
          setTimeout(() => {
            button.textContent = "Copy";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
