<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>astro's apps</title>
    <meta name="description" content="Linux apps by astro. Install one with Flatpak and it stays up to date.">
    <meta name="theme-color" content="#211f2b">
    <meta property="og:type" content="website">
    <meta property="og:title" content="astro's apps">
    <meta property="og:description" content="Linux apps by astro. Install one with Flatpak and it stays up to date.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/Nunito-Latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/FiraCode-Latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css?v=@STYLES_VERSION@">
    <script src="/oneko.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand-bed" data-oneko-home><img class="brand-cat" src="/favicon.png" alt="" width="32" height="32"></span>
          <span>astro's apps</span>
        </a>
        <a class="header-link" href="https://4st.li/">4st.li</a>
      </header>

      <section class="hero">
        <h1>Apps for Linux</h1>
        <p class="lede">Install one and it updates with the rest of your system.</p>
      </section>

      <section class="catalog" aria-label="Apps">
        <div class="catalog-list">
          <!-- APP_CARDS -->
        </div>
      </section>

      <details class="terminal">
        <summary>Using the terminal?</summary>
        <div class="command-row">
          <pre><code>flatpak remote-add --if-not-exists astrovm https://flatpak.4st.li/astrovm.flatpakrepo</code></pre>
          <button
            class="copy-button"
            type="button"
            data-copy="flatpak remote-add --if-not-exists astrovm https://flatpak.4st.li/astrovm.flatpakrepo"
          >
            Copy
          </button>
        </div>
      </details>
    </main>
    <script>
      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(button.dataset.copy);
          } catch {
            const field = document.createElement("textarea");
            field.value = button.dataset.copy;
            document.body.append(field);
            field.select();
            document.execCommand("copy");
            field.remove();
          }
          button.textContent = "Copied ♡";
          setTimeout(() => {
            button.textContent = "Copy";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
