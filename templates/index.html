<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>astrovm Flatpak Repository</title>
    <meta
      name="description"
      content="Linux apps by astrovm. Install them with Flatpak and they stay up to date."
    >
    <meta name="theme-color" content="#0b0d12">
    <meta property="og:type" content="website">
    <meta property="og:title" content="astrovm Flatpak Repository">
    <meta property="og:description" content="Linux apps by astrovm. Install them with Flatpak and they stay up to date.">
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312151c'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='36' font-weight='800' fill='%235b9cff' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="/styles.css?v=@STYLES_VERSION@">
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="/">
          astrovm
        </a>
      </header>

      <section class="hero">
        <h1>Linux apps by astrovm</h1>
        <p class="lede">
          Install one and it updates with the rest of your system.
        </p>
      </section>

      <section class="catalog" aria-label="Available apps">
        <div class="catalog-list">
          <!-- APP_CARDS -->
        </div>
      </section>

      <details class="terminal">
        <summary>Using the terminal?</summary>
        <div class="command-row">
          <pre><code>flatpak remote-add --if-not-exists astrovm https://flatpak.4st.li/astrovm.flatpakrepo</code></pre>
          <button
            class="copy-button"
            type="button"
            data-copy="flatpak remote-add --if-not-exists astrovm https://flatpak.4st.li/astrovm.flatpakrepo"
          >
            Copy
          </button>
        </div>
      </details>
    </main>
    <script>
      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(button.dataset.copy);
          } catch {
            const field = document.createElement("textarea");
            field.value = button.dataset.copy;
            document.body.append(field);
            field.select();
            document.execCommand("copy");
            field.remove();
          }
          button.textContent = "Copied";
          setTimeout(() => {
            button.textContent = "Copy";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
