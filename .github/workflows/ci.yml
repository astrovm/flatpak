name: CI

on:
  pull_request:

permissions:
  contents: read

# New commits supersede older runs for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq kcov shellcheck tidy

      - name: Validate shell scripts
        run: |
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 bash -n
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Validate application registry
        run: jq -e . apps.json >/dev/null

      - name: Test publishing logic
        run: |
          tests/test-publishing.sh
          tests/test-scripts.sh
          tests/test-packages.sh
          tests/test-etcher-lsblk.sh
          tests/test-package-layouts.sh
          tests/test-package-updates.sh

      - name: Validate package metadata
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          for manifest in packages/*/*.json; do jq -e . "$manifest" >/dev/null; done
          desktop-file-validate packages/*/*.desktop
          for metadata in packages/*/*.metainfo.xml; do appstreamcli validate --no-net "$metadata"; done

      - name: Measure test coverage
        run: tests/coverage.sh

      - name: Validate HTML templates
        run: tidy -errors -quiet templates/*.html

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color
