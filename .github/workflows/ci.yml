name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt update
          sudo apt install -y jq shellcheck tidy

      - name: Validate shell scripts
        run: |
          find scripts tests -type f -name '*.sh' -exec bash -n {} +
          find scripts tests -type f -name '*.sh' -exec shellcheck {} +

      - name: Test publishing logic
        run: tests/test-publishing.sh

      - name: Validate HTML templates
        run: tidy -errors -quiet templates/*.html

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color
